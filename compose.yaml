services:
  postgres:
    image: postgres:17
    container_name: matchnade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: matchnade
      POSTGRES_USER: matchnade_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchnade_user -d matchnade"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
