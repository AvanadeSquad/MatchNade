name: CodeQL

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    # Toda segunda-feira às 06:17 UTC, para pegar consultas novas mesmo sem commits.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  analise:
    name: Análise do JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
