name: CodeQL

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    # Toda segunda-feira às 06:17 UTC, para pegar consultas novas mesmo sem commits.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  analise:
    name: Análise do JavaScript
    # O Code scanning precisa estar ligado no repositório (em repositório privado, depende do
    # recurso de segurança do plano). Sem a variável CODEQL_ATIVO igual a true, o job fica pulado.
    if: vars.CODEQL_ATIVO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
