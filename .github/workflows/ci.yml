name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

# Um push novo no mesmo PR ou branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (testes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  backend-postgres:
    name: Backend (testes em PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: teste
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: matchnade_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teste -d matchnade_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          # Credenciais descartáveis do serviço acima, que só existe durante o job.
          TEST_DATABASE_URL: postgresql://teste:teste@localhost:5432/matchnade_teste

  frontend:
    name: Frontend (testes e build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:cabecalhos
      - run: npm run build

  lint:
    name: Lint e formatação
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pasta: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.pasta }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.pasta }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  e2e:
    name: Ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: relatorio-playwright
          path: e2e/playwright-report
          retention-days: 7

  auditoria:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # O e2e fica de fora: só tem dependências de desenvolvimento (Playwright), então
        # --omit=dev não teria nada a conferir, e nada dele vai para o que é publicado.
        pasta: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.pasta }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Falha só com vulnerabilidade alta ou crítica nas dependências de produção.
      # As de desenvolvimento (executores de teste, build) não vão para o que é publicado.
      - run: npm audit --audit-level=high --omit=dev
